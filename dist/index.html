<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#101113"><meta name="description" content="Your bots, their teams, and how they work together.">
  <script src="theme.js"></script>
  <title>Team map</title><link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header><div class="heading"><span id="heading-icon"></span><div><div class="title-row"><h1>Team map</h1><span id="count" role="status" aria-live="polite"></span></div><p>Your bots, their teams, and how they work together.</p></div></div><div class="header-actions"><label class="search-box"><span id="search-icon"></span><input id="search" type="search" placeholder="Search bots, teams, models…" aria-label="Search bots, teams, and models" autocomplete="off" spellcheck="false"><kbd>⌘ K</kbd></label><button id="oled-toggle" class="display-toggle" type="button" aria-label="OLED mode" aria-pressed="false" title="Use pure black backgrounds for OLED screens">OLED</button><span class="connection" id="connection">Loading map</span><button id="refresh" class="icon-button" aria-label="Refresh map" title="Refresh map"></button></div></header>
    <div id="viewport" tabindex="0" role="region" aria-label="Team map canvas. Drag to pan; use plus and minus to zoom."><div id="world"></div><div id="empty" hidden></div><div class="canvas-footer"><span id="hint">Drag teams to arrange · Scroll to pan · Click a bot for details</span><div class="zoom-controls"><button id="minus" aria-label="Zoom out">−</button><button id="fit" aria-label="Fit all teams" title="Fit all teams">100%</button><button id="plus" aria-label="Zoom in">+</button></div></div><div id="notice" role="status" aria-live="polite"></div></div>
  </main>
  <dialog id="bot-dialog" aria-label="Bot details"><button class="close icon-button" id="close" aria-label="Close details">×</button><div id="bot-detail"></div><nav class="detail-tabs" role="tablist" aria-label="Bot details"><button id="tab-soul" role="tab" aria-controls="detail-panel" aria-selected="true" data-tab="soul">Soul</button><button id="tab-skills" role="tab" aria-controls="detail-panel" aria-selected="false" tabindex="-1" data-tab="skills">Skills</button><button id="tab-config" role="tab" aria-controls="detail-panel" aria-selected="false" tabindex="-1" data-tab="config">Configuration</button></nav><section id="detail-panel" role="tabpanel" aria-labelledby="tab-soul" tabindex="0"></section></dialog>
  <script src="app.js" defer></script>
</body></html>
